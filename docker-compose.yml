services:
  postgres:
    image: postgres:16-alpine
    container_name: dmh-postgres
    environment:
      POSTGRES_USER: dmh
      POSTGRES_PASSWORD: dmh_dev_password
      POSTGRES_DB: digitalmyhotels
    ports:
      # 5434 on the host: another local Postgres already occupies 5432
      - "5434:5432"
    volumes:
      - dmh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmh -d digitalmyhotels"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dmh_pgdata:
