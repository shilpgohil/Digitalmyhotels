name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dmh
          POSTGRES_PASSWORD: dmh_dev_password
          POSTGRES_DB: digitalmyhotels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check app tests scripts

      - name: Mypy type check
        run: python -m mypy app --ignore-missing-imports

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://dmh:dmh_dev_password@localhost:5432/digitalmyhotels_test
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://dmh:dmh_dev_password@localhost:5432/digitalmyhotels
          TEST_DATABASE_URL: postgresql+asyncpg://dmh:dmh_dev_password@localhost:5432/digitalmyhotels_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          UPI_ENCRYPTION_KEY: ci-test-upi-key-not-for-production
          APP_ENV: test
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend — TypeScript, ESLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
