name: Keep Render Alive

# Render free-tier services sleep after 15 minutes of inactivity.
# This workflow pings the health endpoint every 14 minutes to prevent sleep.
# GitHub Actions free tier gives 2,000 min/month — this uses ~720 min/month.

on:
  schedule:
    # Every 10 minutes, 24/7 — Render free tier sleeps after 15 min of inactivity.
    # Pinging every 10 min gives a 5-min safety buffer.
    # GitHub Actions cron uses ~720 min/month on 14-min; 10-min uses ~1,008 min/month
    # (still well within the 2,000 min free quota).
    - cron: "*/10 * * * *"
  workflow_dispatch:    # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping backend health
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /health
        run: |
          # Singapore service URL pinned directly — the RENDER_BACKEND_URL secret
          # previously pointed at the old suspended Oregon service, which made
          # every run fail with a timeout. Do NOT reintroduce the secret unless
          # the backend URL changes.
          RENDER_URL="https://digitalmyhotels-api-sg.onrender.com"
          echo "Pinging $RENDER_URL/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$RENDER_URL/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status $STATUS — service may be down"
            exit 1
          fi
          echo "Service is healthy"
