name: Keep Services Alive

# Two layers keep the Render free-tier backend awake:
#   1. PRIMARY: the backend self-pings its own public URL every 10 minutes
#      (app/services/keepalive.py) — reliable while the process is running.
#   2. BACKUP (this workflow): wakes the service if it IS asleep (crash,
#      Render maintenance, redeploy window). GitHub throttles schedules
#      heavily (observed 1-5 h gaps), which is fine for a wake-up call but
#      was never reliable as the only keep-alive.
# It also checks the Vercel frontend so an outage of either service turns
# the workflow red and is noticed.

on:
  schedule:
    - cron: "*/10 * * * *" # best-effort; GitHub may run this far less often
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI

jobs:
  ping:
    name: Ping backend + frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake Render backend
        run: |
          # Singapore service URL pinned directly — do NOT reintroduce the
          # RENDER_BACKEND_URL secret (it once pointed at a dead service).
          URL="https://digitalmyhotels-api-sg.onrender.com/health"
          echo "Pinging $URL ..."
          # A sleeping free-tier service needs 30-90 s to cold-start, and the
          # first request may be dropped — retry up to 4 times.
          for attempt in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is awake and healthy"
              exit 0
            fi
            sleep 20
          done
          echo "Backend did not respond after 4 attempts — investigate"
          exit 1

      - name: Check Vercel frontend
        run: |
          URL="https://digitalmyhotels.vercel.app/login"
          echo "Checking $URL ..."
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Frontend did not respond — investigate"
          exit 1
